    <text x="190" y="304">Zayne foge e a HQ começa</text>

    <text x="310" y="95" font-size="16" font-weight="bold">3.960 a.B.Y.</text>
    <text x="310" y="115">Fim das Guerras</text>
    <text x="310" y="131">Mandalorianas</text>

    <text x="430" y="268" font-size="16" font-weight="bold">3.959 a.B.Y.</text>
